services:
  catalogue:
    image: ghcr.io/Firefox2100/roleplay-catalogue:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${CATALOGUE_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      RC_APP_HOST: 127.0.0.1
      RC_APP_PORT: 9798
      RC_API_PREFIX: ""
      RC_MONGODB_HOST: mongodb
      RC_MONGODB_PORT: 27017
      RC_MONGODB_DIRECT_CONNECTION: "false"
      RC_MONGODB_REPLICA_SET: rs0
      RC_S3_ENDPOINT_URL: http://minio:9000
      NGINX_HSTS_HEADER: ${NGINX_HSTS_HEADER:-}
      NGINX_CONTENT_SECURITY_POLICY: "${NGINX_CONTENT_SECURITY_POLICY:-default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'}"
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  mongodb:
    image: mongodb/mongodb-community-server:latest
    hostname: mongodb
    restart: unless-stopped
    command: ["mongod", "--config", "/etc/mongod.conf", "--replSetMember", "mongodb:27017"]
    volumes:
      - mongodb-data:/data/db
      - ./deploy/mongod.conf:/etc/mongod.conf:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb-init:
    image: mongodb/mongodb-community-server:latest
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-search-secret:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/deploy/init-mongodb.sh"]
    environment:
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:-local-search-change-me}
    volumes:
      - ./deploy/init-mongodb.sh:/deploy/init-mongodb.sh:ro

  mongodb-search-secret:
    image: mongodb/mongodb-community-server:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && printf %s "$$MONGOT_PASSWORD" > /search-secrets/passwordFile &&
        chmod 0444 /search-secrets/passwordFile
    environment:
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:-local-search-change-me}
    volumes:
      - mongodb-search-secrets:/search-secrets

  mongodb-search:
    image: mongodb/mongodb-community-search:latest
    hostname: mongodb-search
    restart: unless-stopped
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    volumes:
      - mongodb-search-data:/data/mongot
      - mongodb-search-secrets:/search-secrets:ro
      - ./deploy/mongot.conf:/mongot-community/config.default.yml:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${RC_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RC_S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$RC_S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${RC_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RC_S3_SECRET_ACCESS_KEY:-minioadmin}
      RC_S3_BUCKET: ${RC_S3_BUCKET:-roleplay-catalogue}

volumes:
  mongodb-data:
  mongodb-search-data:
  mongodb-search-secrets:
  minio-data:
