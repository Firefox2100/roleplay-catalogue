name: roleplay-catalogue-dev

services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0.6
    container_name: atlas-local
    hostname: mongodb
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-devpassword}
      MONGOT_LOG_FILE: /dev/stderr
      RUNNER_LOG_FILE: /dev/stderr
    ports:
      - "19797:27017"
    volumes:
      - mongo-db:/data/db
      - mongo-config:/data/configdb
      - mongo-mongot:/data/mongot

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -bucket=${RC_S3_BUCKET:-roleplay-catalogue}
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${RC_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${RC_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "19798:8333"
      - "19799:23646"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "19800:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-db:
  mongo-config:
  mongo-mongot:
  seaweedfs-data:
  redis-data:
