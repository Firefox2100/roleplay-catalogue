<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Activate your Roleplay Catalogue account</title>
  </head>
  <body>
    <p>Hello {{ username }},</p>
    <p>Click the link below to activate your Roleplay Catalogue account:</p>

  </body>
</html>
