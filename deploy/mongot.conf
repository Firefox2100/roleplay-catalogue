syncSource:
  replicaSet:
    hostAndPort:
      - mongodb:27017
    scramAuth:
      username: mongotUser
      passwordFile: /search-secrets/passwordFile
      authSource: admin
      tls:
        enabled: false
  replicationReader:
    readPreference: primaryPreferred
storage:
  dataPath: /data/mongot
server:
  grpc:
    address: mongodb-search:27028
    tls:
      mode: disabled
metrics:
  enabled: true
  address: mongodb-search:9946
healthCheck:
  address: mongodb-search:8080
logging:
  verbosity: INFO
