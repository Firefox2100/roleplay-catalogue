name: Code Analysis with SonarQube

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:ci

      - name: Convert frontend test results for SonarQube
        working-directory: frontend
        run: python scripts/junit_to_sonar.py test-results.xml test-results-sonar.xml

      - name: Run backend tests with coverage
        run: |
          export PYTHONPATH=./src:$PYTHONPATH
          pytest --junitxml=test-results.xml --cov=roleplay_catalogue --cov-report=xml

      - name: Extract Version
        run: |
          VERSION=$(awk -F"'" '/^__version__/ {print $2}' ./src/roleplay_catalogue/__init__.py)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ env.VERSION }}

      - name: Publish test results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16
        if: always() && hashFiles('test-results.xml', 'frontend/test-results.xml') != ''
        with:
          report_paths: "test-results.xml,frontend/test-results.xml"

      - name: Publish frontend coverage
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        with:
          working-directory: frontend

      - name: Generate coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        if: always() && hashFiles('coverage.xml') != ''
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Publish coverage in job summary
        if: always() && hashFiles('code-coverage-results.md') != ''
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Publish coverage PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        if: always() && github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != ''
        with:
          recreate: true
          path: code-coverage-results.md
