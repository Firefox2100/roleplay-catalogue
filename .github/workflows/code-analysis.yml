name: Code Analysis with SonarQube

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: >-
          python -m pip install --only-binary=:all: '.[test]'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:ci

      - name: Convert frontend test results for SonarQube
        working-directory: frontend
        run: python scripts/junit_to_sonar.py test-results.xml test-results-sonar.xml

      - name: Run backend tests with coverage
        run: |
          export PYTHONPATH=./src:$PYTHONPATH
          pytest --junitxml=test-results.xml --cov=roleplay_catalogue --cov-report=xml

      - name: Extract Version
        run: echo "VERSION=$(PYTHONPATH=src python -c 'from roleplay_catalogue import __version__; print(__version__)')" >> "$GITHUB_ENV"

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ env.VERSION }}

      - name: Publish test results
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: always() && hashFiles('test-results.xml', 'frontend/test-results.xml') != ''
        with:
          report_paths: "test-results.xml,frontend/test-results.xml"

      - name: Publish frontend coverage
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        with:
          working-directory: frontend

      - name: Generate coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        if: always() && hashFiles('coverage.xml') != ''
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Publish coverage in job summary
        if: always() && hashFiles('code-coverage-results.md') != ''
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Publish coverage PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always() && github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != ''
        with:
          recreate: true
          path: code-coverage-results.md
