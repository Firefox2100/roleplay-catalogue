name: Code Analysis with SonarQube

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run tests with coverage
        continue-on-error: true
        run: |
          export PYTHONPATH=./src:$PYTHONPATH
          pytest --junitxml=test-results.xml --cov=roleplay_catalogue --cov-report=xml

      - name: Extract Version
        run: |
          VERSION=$(awk -F"'" '/^__version__/ {print $2}' ./src/roleplay_catalogue/__init__.py)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ env.VERSION }}

      - name: Publish test results
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3
        if: always() && hashFiles('test-results.xml') != ''
        with:
          report_paths: "test-results.xml"

      - name: Generate coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        if: always() && hashFiles('coverage.xml') != ''
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Publish coverage in job summary
        if: always() && hashFiles('code-coverage-results.md') != ''
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Publish coverage PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        if: always() && github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != ''
        with:
          recreate: true
          path: code-coverage-results.md
