[project]
site_url = "https://firefox2100.github.io/roleplay-catalogue/zh/"
site_name = "角色扮演资源库"
site_description = "一个开源的解决方案，用于托管角色扮演相关的资源，包括角色卡片、背景故事书等。"
site_author = "Firefox2100"
copyright = "Copyright &copy; 2026 Firefox2100"
repo_url = "https://github.com/Firefox2100/roleplay-catalogue"
repo_name = "Firefox2100/roleplay-catalogue"

docs_dir = "docs/zh"
site_dir = "site/zh"

nav = [
  { "概览" = "index.md" },
  { "快速开始" = "quick-start.md" },
  { "部署" = "deployment.md" },
  { "配置选项" = "configuration.md" },
  { "功能指南" = [
    { "角色卡" = "features/character-cards.md" },
    { "背景设定书" = "features/lore-books.md" },
    { "聊天预设" = "features/chat-presets.md" },
    { "图片与封面" = "features/images.md" },
    { "WorldSE 数据包" = "features/worlds.md" },
    { "版本管理与发布" = "features/versioning.md" },
    { "资源 Fork（衍生）" = "features/forking.md" },
    { "协作者编辑" = "features/collaborative-editing.md" },
    { "搜索与过滤" = "features/search-and-filtering.md" },
    { "导入资源" = "features/importing-resources.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "zh"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Firefox2100/roleplay-catalogue"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.extra]
alternate = [
    { name = "English", link = "/roleplay-catalogue/", lang = "en" },
    { name = "中文", link = "/roleplay-catalogue/zh/", lang = "zh" }
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
